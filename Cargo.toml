[package]
name = "iaca"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An inspectable coding loop with Meta Wonder and deterministic Refal verification"
repository = "https://github.com/Abhinav-Rust/IACA"

[dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "net", "fs"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
uuid = { version = "1", features = ["v4"] }
refal-ast = { git = "https://github.com/Abhinav-Rust/REFAL-SUPERSYSTEM", rev = "c8f95421350b6d7d50a01e83278da4a33fae3b61" }
refal-syntax = { git = "https://github.com/Abhinav-Rust/REFAL-SUPERSYSTEM", rev = "c8f95421350b6d7d50a01e83278da4a33fae3b61" }
refal-semantics = { git = "https://github.com/Abhinav-Rust/REFAL-SUPERSYSTEM", rev = "c8f95421350b6d7d50a01e83278da4a33fae3b61" }
refal-runtime = { git = "https://github.com/Abhinav-Rust/REFAL-SUPERSYSTEM", rev = "c8f95421350b6d7d50a01e83278da4a33fae3b61" }
refal-core = { git = "https://github.com/Abhinav-Rust/REFAL-SUPERSYSTEM", rev = "c8f95421350b6d7d50a01e83278da4a33fae3b61" }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
